<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <div class="header">
            <img src="images/icon-48.png" alt="HoverZoom+" class="logo">
            <h1>HoverZoom+</h1>
        </div>
        <div class="toggle-container">
            <label class="toggle">
                <input type="checkbox" id="enableToggle" checked>
                <span class="slider"></span>
            </label>
            <span id="statusText">Enabled</span>
        </div>
        <div class="info">
            <p>Hover over images to zoom</p>
            <p class="version">Safari Edition v1.0</p>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
