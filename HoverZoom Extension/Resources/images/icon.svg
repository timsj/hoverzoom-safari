<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient with depth -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9D8DF1"/>
      <stop offset="50%" style="stop-color:#7B68EE"/>
      <stop offset="100%" style="stop-color:#5046C4"/>
    </linearGradient>
    <!-- Drop shadow for glass elements -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3D2E8C" flood-opacity="0.4"/>
    </filter>
    <!-- Glass fill gradient -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E8E4FF;stop-opacity:1"/>
    </linearGradient>
    <!-- Highlight shine -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <!-- Sky gradient for image -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F4FF"/>
    </linearGradient>
    <!-- Clip path for lens content -->
    <clipPath id="lensClip">
      <circle cx="210" cy="210" r="95"/>
    </clipPath>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGradient)"/>

  <!-- Top highlight shine -->
  <rect x="16" y="16" width="480" height="240" rx="96" ry="96" fill="url(#shineGradient)" clip-path="inset(0 0 50% 0)"/>

  <!-- Magnifying glass group with shadow -->
  <g filter="url(#dropShadow)">
    <!-- Image inside lens -->
    <g clip-path="url(#lensClip)">
      <!-- Sky background -->
      <rect x="115" y="115" width="190" height="190" fill="url(#skyGradient)"/>
      <!-- Sun -->
      <circle cx="260" cy="160" r="22" fill="#FFD93D"/>
      <!-- Mountains -->
      <polygon points="115,280 175,200 235,260 280,190 305,260 305,305 115,305" fill="#6B8E6B"/>
      <polygon points="140,280 200,220 260,280 305,305 115,305" fill="#4A7A4A"/>
      <!-- Ground -->
      <rect x="115" y="275" width="190" height="30" fill="#7CB77C"/>
    </g>

    <!-- Glass lens ring -->
    <circle cx="210" cy="210" r="113" fill="none" stroke="url(#glassGradient)" stroke-width="36"/>
    <!-- Lens inner highlight -->
    <circle cx="210" cy="210" r="92" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Handle -->
    <line x1="298" y1="298" x2="410" y2="410" stroke="url(#glassGradient)" stroke-width="44" stroke-linecap="round"/>
  </g>

  <!-- Subtle top-left lens reflection -->
  <ellipse cx="165" cy="165" rx="40" ry="18" fill="#ffffff" fill-opacity="0.3" transform="rotate(-45 165 165)"/>
</svg>
