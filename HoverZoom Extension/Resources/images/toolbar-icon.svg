<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="toolbarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7CF6"/>
      <stop offset="100%" style="stop-color:#5856D6"/>
    </linearGradient>
    <clipPath id="lensClipSmall">
      <circle cx="6.5" cy="6.5" r="4"/>
    </clipPath>
  </defs>
  <!-- Shadow layer for depth -->
  <circle cx="6.5" cy="7" r="5" fill="none" stroke="#3D2E8C" stroke-width="1.5" stroke-opacity="0.2"/>
  <line x1="10.5" y1="11" x2="14.5" y2="15" stroke="#3D2E8C" stroke-width="2" stroke-linecap="round" stroke-opacity="0.2"/>
  <!-- Image inside lens -->
  <g clip-path="url(#lensClipSmall)">
    <rect x="2" y="2" width="9" height="9" fill="#87CEEB"/>
    <circle cx="8.5" cy="4" r="1.2" fill="#FFD93D"/>
    <polygon points="2,9.5 5,6 7,8 9,5.5 11,8 11,11 2,11" fill="#5A8A5A"/>
  </g>
  <!-- Magnifying glass lens -->
  <circle cx="6.5" cy="6.5" r="5" fill="none" stroke="url(#toolbarGradient)" stroke-width="2"/>
  <!-- Handle -->
  <line x1="10.5" y1="10.5" x2="14.5" y2="14.5" stroke="url(#toolbarGradient)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
